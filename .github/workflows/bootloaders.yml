name: bootloaders

on:
  # Sent by the bootloader source repositories when they are pushed.
  repository_dispatch:
    types: [bootloader-update]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the bootloader sources did not change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootloaders
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: k3
            manifest: bootloader-spacemit.xml
            config: config/boards/spacemit-k3.yaml
            path: spacemit/k3/bootloader
          - board: a210
            manifest: bootloader-alibaba.xml
            config: config/boards/alibaba-a210.yaml
            path: alibaba/a210/bootloader
    env:
      BRANCH: android-17
      MANIFEST_URL: https://github.com/riseproject-dev/android_manifest
    steps:
      # Related pushes to several source repositories arrive within minutes;
      # their dispatches queue behind this run and collapse into one check.
      - name: Wait for related source pushes
        if: github.event_name == 'repository_dispatch' && strategy.job-index == 0
        run: sleep 180

      - name: Check bootloader sources
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          # Skip commits touching the directory without rebuilding it.
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BRANCH&path=${{ matrix.path }}&per_page=30" \
            --jq '[.[].commit.message | select(contains("android_bootloader_build"))][0] // ""' \
            > last-commit.txt
          curl -fsSL "https://raw.githubusercontent.com/riseproject-dev/android_manifest/$BRANCH/${{ matrix.manifest }}" \
            -o manifest.xml
          python3 - <<'EOF'
          import os, re, subprocess, xml.etree.ElementTree as ET

          root = ET.parse("manifest.xml").getroot()
          fetch = root.find("remote").get("fetch")
          # The last binaries commit lists the source commits it was built from.
          built = set(re.findall(r"\b[0-9a-f]{7,40}\b", open("last-commit.txt").read()))

          changed = []
          for project in root.iter("project"):
              url = fetch + project.get("name")
              ref = "refs/heads/" + project.get("revision")
              head = subprocess.run(["git", "ls-remote", url, ref], check=True,
                                    capture_output=True, text=True).stdout.split()[0]
              state = "built" if any(head.startswith(s) for s in built) else "new"
              print(f"{project.get('name')} {project.get('revision')} {head} {state}")
              if state == "new":
                  changed.append(project.get("name"))

          build = bool(changed) or os.environ["FORCE"] == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"build={str(build).lower()}\n")
          EOF

      - name: Check out vendor/rise
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          path: aosp/vendor/rise
          persist-credentials: false

      - name: Install system packages
        if: steps.check.outputs.build == 'true' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex device-tree-compiler u-boot-tools libssl-dev libgnutls28-dev \
            swig fdisk xxd python3-dev python3-setuptools python3-pyelftools \
            python3-cryptography python3-pycryptodome python3-jsonschema python-is-python3

      - name: Install build tools
        if: steps.check.outputs.build == 'true'
        run: |
          pipx install shyaml
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync bootloader sources
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p bootloaders-${{ matrix.board }}
          cd bootloaders-${{ matrix.board }}
          repo init -u "$MANIFEST_URL" -b "$BRANCH" -m "${{ matrix.manifest }}" --depth=1
          repo sync -c --no-tags -j4
          # Self-hosted runners keep the workspace between runs.
          repo forall -c git clean -fdxq
          rm -rf out

      - name: Cache toolchain
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: bootloaders-${{ matrix.board }}/toolchains
          key: bootloader-toolchain-${{ matrix.board }}-${{ hashFiles(format('bootloaders-{0}/build-bootloaders/utils.sh', matrix.board)) }}

      - name: Build bootloaders
        if: steps.check.outputs.build == 'true'
        working-directory: bootloaders-${{ matrix.board }}/build-bootloaders
        run: bash release_android.sh --aosp="$GITHUB_WORKSPACE/aosp" --config=${{ matrix.config }} --mode=release

      # The releases ship the bootloader sources pinned to the commits built.
      - name: Record the pinned sources
        if: steps.check.outputs.build == 'true'
        working-directory: bootloaders-${{ matrix.board }}
        run: repo manifest -r -o "$GITHUB_WORKSPACE/aosp/vendor/rise/${{ matrix.path }}/${{ matrix.manifest }}"

      # The build runs code from every synced project, so this job holds no
      # token that can push: the publish job commits the binaries.
      - name: Stage the binaries
        id: stage
        if: steps.check.outputs.build == 'true'
        env:
          GIT_AUTHOR_NAME: bootloader build
          GIT_AUTHOR_EMAIL: bootloader-build@localhost
          GIT_COMMITTER_NAME: bootloader build
          GIT_COMMITTER_EMAIL: bootloader-build@localhost
        run: |
          if [ -z "$(git -C aosp/vendor/rise status --porcelain -- ${{ matrix.path }})" ]; then
            echo "Binaries unchanged, nothing to commit."
            exit 0
          fi
          # The script writes the message, which lists the sources built, as
          # it commits.
          (cd bootloaders-${{ matrix.board }}/build-bootloaders &&
            bash release_android.sh --aosp="$GITHUB_WORKSPACE/aosp" --config=${{ matrix.config }} \
              --mode=release --no-build --commit)
          stage="$RUNNER_TEMP/artifact/${{ matrix.board }}"
          mkdir -p "$stage"
          tar -cf "$stage/binaries.tar" -C aosp/vendor/rise ${{ matrix.path }}
          echo ${{ matrix.path }} > "$stage/path"
          git -C aosp/vendor/rise log -1 --format=%B | sed '/^Signed-off-by:/d' > "$stage/message"
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Upload the binaries
        if: steps.stage.outputs.staged == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bootloaders-${{ matrix.board }}
          path: ${{ runner.temp }}/artifact
          retention-days: 1

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      BRANCH: android-17
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bootloaders-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true

      # A build job uploads nothing when its binaries did not change.
      - name: Look for binaries
        id: found
        run: |
          if ls "$RUNNER_TEMP"/binaries/*/binaries.tar >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No binaries to commit."
          fi

      # Commit and push as the riseproject-dev App rather than GITHUB_TOKEN.
      - name: Get a riseproject-dev App token
        if: steps.found.outputs.found == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out vendor/rise
        if: steps.found.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Commit and push the binaries
        if: steps.found.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # The account id in the address ties the commits to the App bot.
          bot_id=$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$bot_id+${APP_SLUG}[bot]@users.noreply.github.com"
          for dir in "$RUNNER_TEMP"/binaries/*/; do
            path=$(cat "$dir/path")
            # Only let the build update the bootloader directories. Compare
            # whole strings, as the path it hands over may span several lines.
            if [ "$path" != spacemit/k3/bootloader ] && [ "$path" != alibaba/a210/bootloader ]; then
              echo "Refusing binaries for unexpected path '$path'." >&2
              exit 1
            fi
            rm -rf "$path"
            tar -xf "$dir/binaries.tar" -- "$path"
            git add -A -- "$path"
            if git diff --cached --quiet; then
              echo "$path unchanged, nothing to commit."
              continue
            fi
            git commit -s -q -F "$dir/message"
          done
          if [ "$(git rev-list --count "origin/$BRANCH..HEAD")" -eq 0 ]; then
            exit 0
          fi
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git pull -q --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
