name: bootloaders

on:
  # Sent by the bootloader source repositories when they are pushed.
  repository_dispatch:
    types: [bootloader-update]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the bootloader sources did not change
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bootloaders
  cancel-in-progress: false

jobs:
  update:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Both boards push to the same branch.
      max-parallel: 1
      matrix:
        include:
          - board: k3
            manifest: bootloader-spacemit.xml
            config: config/boards/spacemit-k3.yaml
            path: spacemit/k3/bootloader
          - board: a210
            manifest: bootloader-alibaba.xml
            config: config/boards/alibaba-a210.yaml
            path: alibaba/a210/bootloader
    env:
      BRANCH: android-17
      MANIFEST_URL: https://github.com/riseproject-dev/android_manifest
    steps:
      # Related pushes to several source repositories arrive within minutes;
      # their dispatches queue behind this run and collapse into one check.
      - name: Wait for related source pushes
        if: github.event_name == 'repository_dispatch' && strategy.job-index == 0
        run: sleep 180

      - name: Check bootloader sources
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          # Skip commits touching the directory without rebuilding it.
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BRANCH&path=${{ matrix.path }}&per_page=30" \
            --jq '[.[].commit.message | select(contains("android_bootloader_build"))][0] // ""' \
            > last-commit.txt
          curl -fsSL "https://raw.githubusercontent.com/riseproject-dev/android_manifest/$BRANCH/${{ matrix.manifest }}" \
            -o manifest.xml
          python3 - <<'EOF'
          import os, re, subprocess, xml.etree.ElementTree as ET

          root = ET.parse("manifest.xml").getroot()
          fetch = root.find("remote").get("fetch")
          # The last binaries commit lists the source commits it was built from.
          built = set(re.findall(r"\b[0-9a-f]{7,40}\b", open("last-commit.txt").read()))

          changed = []
          for project in root.iter("project"):
              url = fetch + project.get("name")
              ref = "refs/heads/" + project.get("revision")
              head = subprocess.run(["git", "ls-remote", url, ref], check=True,
                                    capture_output=True, text=True).stdout.split()[0]
              state = "built" if any(head.startswith(s) for s in built) else "new"
              print(f"{project.get('name')} {project.get('revision')} {head} {state}")
              if state == "new":
                  changed.append(project.get("name"))

          build = bool(changed) or os.environ["FORCE"] == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"build={str(build).lower()}\n")
          EOF

      - name: Check out vendor/rise
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          path: aosp/vendor/rise

      - name: Install system packages
        if: steps.check.outputs.build == 'true' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex device-tree-compiler u-boot-tools libssl-dev libgnutls28-dev \
            swig fdisk xxd python3-dev python3-setuptools python3-pyelftools \
            python3-cryptography python3-pycryptodome python3-jsonschema python-is-python3

      - name: Install build tools
        if: steps.check.outputs.build == 'true'
        run: |
          pipx install shyaml
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync bootloader sources
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p bootloaders-${{ matrix.board }}
          cd bootloaders-${{ matrix.board }}
          repo init -u "$MANIFEST_URL" -b "$BRANCH" -m "${{ matrix.manifest }}" --depth=1
          repo sync -c --no-tags -j4
          # Self-hosted runners keep the workspace between runs.
          repo forall -c git clean -fdxq
          rm -rf out

      - name: Cache toolchain
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: bootloaders-${{ matrix.board }}/toolchains
          key: bootloader-toolchain-${{ matrix.board }}-${{ hashFiles(format('bootloaders-{0}/build-bootloaders/utils.sh', matrix.board)) }}

      - name: Build bootloaders
        if: steps.check.outputs.build == 'true'
        working-directory: bootloaders-${{ matrix.board }}/build-bootloaders
        run: bash release_android.sh --aosp="$GITHUB_WORKSPACE/aosp" --config=${{ matrix.config }} --mode=release

      - name: Commit and push binaries
        if: steps.check.outputs.build == 'true'
        run: |
          if [ -z "$(git -C aosp/vendor/rise status --porcelain -- ${{ matrix.path }})" ]; then
            echo "Binaries unchanged, nothing to commit."
            exit 0
          fi
          git -C aosp/vendor/rise config user.name "RISE CI bot"
          git -C aosp/vendor/rise config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd bootloaders-${{ matrix.board }}/build-bootloaders &&
            bash release_android.sh --aosp="$GITHUB_WORKSPACE/aosp" --config=${{ matrix.config }} \
              --mode=release --no-build --commit)
          git -C aosp/vendor/rise pull --rebase origin "$BRANCH"
          git -C aosp/vendor/rise push origin "HEAD:$BRANCH"
